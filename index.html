<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LireMonde</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <base target="_blank">
</head>
<body>
  <nav>
  <div class="nav-inner">
    <a class="logo" onclick="navigate('home')">
      <img src="images/logo.png" alt="LireMonde"/>
      <span>LireMonde</span>
    </a>
    <div class="nav-links">
      <a id="nav-home" class="active" onclick="navigate('home')">Accueil</a>
      <a id="nav-alire" onclick="navigate('alire')">A lire</a>
      <a id="nav-admin" onclick="navigate('admin')">Admin</a>
    </div>
    <div class="nav-search">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" placeholder="Rechercher un livre, un auteur..."
             id="nav-search-input" oninput="onNavSearch(this.value)"/>
    </div>
  </div>
</nav>
<div class="page active" id="page-home">
<div class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <h1>Decouvrez votre<br/>prochaine lecture</h1>
      <p>Explorez notre collection de livres varies et trouvez votre prochain coup de coeur.</p>
      <button class="btn-gold" onclick="document.getElementById('search-main').focus()">
        Explorer maintenant
      </button>
    </div>
    <div class="hero-visual">
      <img src="images/bureau.png" alt="bureau"/>
    </div>
  </div>
</div>
<div class="search-section">
  <div class="search-bar">
    <svg width="16" height="16" fill="none" stroke="var(--gray-mid)" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="search-main"
           placeholder="Rechercher un livre, un auteur..."
           oninput="filterBooks(this.value)"/>
  </div>
  <select class="genre-select" id="genre-dropdown" onchange="filterByGenreDropdown(this.value)">
    <option value="Tous">Tous les genres</option>
    <option>Classique</option>
    <option>Science-fiction</option>
    <option>Drame</option>
    <option>Fantasy</option>
  </select>
</div>

<div class="filter-section">
  <button class="genre-btn active" onclick="selectGenre(this,'Tous')">Tous</button>
  <button class="genre-btn" onclick="selectGenre(this,'Classique')">Classique</button>
  <button class="genre-btn" onclick="selectGenre(this,'Science-fiction')">Science-fiction</button>
  <button class="genre-btn" onclick="selectGenre(this,'Drame')">Drame</button>
  <button class="genre-btn" onclick="selectGenre(this,'Fantasy')">Fantasy</button>
  <span class="count-label" id="book-count"></span>
</div>
<div class="books-section">
  <div class="books-grid" id="books-grid"></div>
</div>
</div>
<div class="page" id="page-alire">

</div>
<div class="page" id="page-admin">

</div>
<div class="modal-overlay" id="modal">
  <div class="modal" style="position:relative;">
    <button class="modal-close" onclick="closeModal()">x</button>
    <div class="modal-body">
      <div class="modal-cover" id="modal-cover"></div>
      <div class="modal-info">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-author" id="modal-author"></div>
        <div><span class="genre-badge" id="modal-genre"></span></div>
        <div class="modal-meta" id="modal-meta"></div>
        <div class="modal-desc-label">Description</div>
        <div class="modal-desc" id="modal-desc"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-outline" id="modal-btn-remove" onclick="toggleReadlist()">Retirer de la liste</button>
      <button class="btn-dark" id="modal-btn-add" onclick="toggleReadlist()">Ajouter a la liste A lire</button>
    </div>
  </div>
</div>
  <script src="script.js"></script>
</body>
</html>
